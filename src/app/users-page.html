<main class="viewer-page" dir="rtl">
  <header>
    <div>
      <p class="eyebrow">پنل کاربران</p>
      <h1>فهرست کاربران</h1>
      <p class="muted">حساب عادی فقط امکان مشاهده و جست‌وجو دارد.</p>
    </div>
    <button type="button" (click)="logout()">خروج</button>
  </header>

  <section class="viewer-card">
    <input
      type="search"
      aria-label="جست‌وجو در فهرست کاربران"
      placeholder="جست‌وجو با نام، ایمیل یا واحد"
      [(ngModel)]="searchText"
    />
    <div class="table-scroll">
      <table>
        <thead>
          <tr><th>نام</th><th>ایمیل</th><th>نقش</th><th>واحد</th><th>وضعیت</th></tr>
        </thead>
        <tbody>
          @for (user of visibleUsers; track user.id) {
            <tr>
              <td>{{ user.name }}</td>
              <td>{{ user.email }}</td>
              <td>{{ user.role }}</td>
              <td>{{ user.department }}</td>
              <td>{{ user.active ? 'فعال' : 'غیرفعال' }}</td>
            </tr>
          } @empty {
            <tr><td class="empty" colspan="5">نتیجه‌ای پیدا نشد.</td></tr>
          }
        </tbody>
      </table>
    </div>
  </section>
</main>
