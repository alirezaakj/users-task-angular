<main class="auth-page" dir="rtl">
  <section class="auth-card">
    <span class="auth-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none">
        <circle cx="9" cy="8" r="3" />
        <path d="M3.5 19c0-3.1 2.2-5 5.5-5s5.5 1.9 5.5 5" />
        <path d="M16 5.5a2.6 2.6 0 0 1 0 5.1M17 14c2.2.5 3.5 2.1 3.5 4.4" />
      </svg>
    </span>
    <p class="eyebrow">پنل مدیریت</p>
    <h1>مدیریت کاربران</h1>
    <p class="auth-description">برای ادامه، نوع دسترسی را انتخاب کنید.</p>

    <button type="button" (click)="chooseRole('admin')">
      <svg class="role-option-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M4 8h16v12H4zM9 8V5h6v3M4 12h16M10 12v2h4v-2" />
      </svg>
      ورود به‌عنوان مدیر سیستم
    </button>
    <button class="quiet-button" type="button" (click)="chooseRole('user')">
      <svg class="role-option-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="12" cy="8" r="3.5" />
        <path d="M5 20c0-3.6 2.9-6.2 7-6.2s7 2.6 7 6.2" />
      </svg>
      ورود به‌عنوان کاربر عادی
    </button>
  </section>
</main>
